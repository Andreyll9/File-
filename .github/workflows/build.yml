              private void confirmDeleteFile(File file, String title, long size) {
                  new AlertDialog.Builder(this)
                          .setTitle("Удаление из памяти")
                          .setMessage("Удалить «" + title + "» (" + fmt(size) + ") навсегда?")
                          .setPositiveButton("Удалить", (d, w) -> {
                              new Thread(() -> {
                                  boolean ok = deleteRecursive(file);
                                  runOnUiThread(() -> {
                                      Toast.makeText(this, ok ? "Удалено" : "Ошибка удаления", Toast.LENGTH_SHORT).show();
                                      loadFoldersAsync();
                                  });
                              }).start();
                          })
                          .setNegativeButton("Отмена", null)
                          .show();
              }

              // Извлечение (Бэкап) APK в папку Download/MiniStorage_Backups
              private void extractApkBackup(AppItem item) {
                  new Thread(() -> {
                      try {
                          File src = new File(item.pkgInfo.applicationInfo.sourceDir);
                          File outDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "MiniStorage_Backups");
                          if (!outDir.exists()) outDir.mkdirs();
                          File dst = new File(outDir, item.pkg + "_" + item.pkgInfo.versionName + ".apk");

                          try (FileInputStream in = new FileInputStream(src);
                               FileOutputStream out = new FileOutputStream(dst)) {
                              byte[] buf = new byte[65536];
                              int len;
                              while ((len = in.read(buf)) > 0) {
                                  out.write(buf, 0, len);
                              }
                          }
                          runOnUiThread(() -> Toast.makeText(this, "Сохранено в: " + dst.getAbsolutePath(), Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "Ошибка бэкапа: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                      }
                  }).start();
              }

              // Глубокий рентген приложения
              private void showDetailsDialog(AppItem item) {
                  PackageManager pm = getPackageManager();
                  PackageInfo pi = item.pkgInfo;
                  ApplicationInfo ai = pi.applicationInfo;

                  int flags = PackageManager.GET_PERMISSIONS | PackageManager.GET_ACTIVITIES
                          | PackageManager.GET_SERVICES | PackageManager.GET_RECEIVERS
                          | PackageManager.GET_PROVIDERS | PackageManager.GET_SIGNATURES;
                  try {
                      pi = pm.getPackageInfo(item.pkg, flags);
                  } catch (Exception ignored) {}

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(28, 24, 28, 24);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  ImageView bigIcon = new ImageView(this);
                  bigIcon.setImageDrawable(item.icon);
                  layout.addView(bigIcon, new LinearLayout.LayoutParams(220, 220));

                  // Кнопки быстрых действий внутри карточки
                  LinearLayout actBar = new LinearLayout(this);
                  actBar.setOrientation(LinearLayout.HORIZONTAL);
                  actBar.setPadding(0, 16, 0, 8);

                  Button backupBtn = smallBtn("Сохранить APK");
                  backupBtn.setOnClickListener(v -> extractApkBackup(item));
                  actBar.addView(backupBtn);

                  Button manifestBtn = smallBtn("Манифест");
                  manifestBtn.setOnClickListener(v -> showManifestViewer(ai.sourceDir));
                  actBar.addView(manifestBtn);

                  final PackageInfo finalPi = pi;
                  Button activitiesBtn = smallBtn("Запуск Activity");
                  activitiesBtn.setOnClickListener(v -> showExportedActivitiesDialog(finalPi));
                  actBar.addView(activitiesBtn);

                  layout.addView(actBar);

                  TextView details = new TextView(this);
                  details.setTextSize(12f);
                  details.setPadding(0, 12, 0, 0);
                  SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());

                  long vCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P ? pi.getLongVersionCode() : pi.versionCode;
                  int minSdk = Build.VERSION.SDK_INT >= Build.VERSION_CODES.N ? ai.minSdkVersion : 0;

                  String installer = "Неизвестно (ADB / Файл)";
                  try {
                      String inst = pm.getInstallerPackageName(item.pkg);
                      if (inst != null) installer = inst;
                  } catch (Exception ignored) {}

                  String sigHash = getSignatureSha256(pi);
                  String nativeDir = ai.nativeLibraryDir != null ? ai.nativeLibraryDir : "Нет";

                  int actCount = pi.activities != null ? pi.activities.length : 0;
                  int srvCount = pi.services != null ? pi.services.length : 0;
                  int rcvCount = pi.receivers != null ? pi.receivers.length : 0;
                  int prvCount = pi.providers != null ? pi.providers.length : 0;

                  StringBuilder sb = new StringBuilder();
                  sb.append("Имя: ").append(item.name).append("\n")
                    .append("Пакет: ").append(item.pkg).append("\n")
                    .append("Версия: ").append(pi.versionName).append(" (").append(vCode).append(")\n\n")
                    .append("--- Память ---\n")
                    .append("Всего: ").append(fmt(item.totalAppSize)).append("\n")
                    .append("Чистый APK: ").append(fmt(item.apkOnlySize)).append("\n")
                    .append("Данные (вкл. Android/data): ").append(fmt(item.dataSize)).append("\n")
                    .append("Кэш: ").append(fmt(item.cacheSize)).append("\n\n")
                    .append("--- Рентген и Тех. данные ---\n")
                    .append("Target SDK: ").append(ai.targetSdkVersion).append(" | Min SDK: ").append(minSdk).append("\n")
                    .append("UID: ").append(ai.uid).append(" | Системное: ").append(item.isSystem ? "Да" : "Нет").append("\n")
                    .append("Источник: ").append(installer).append("\n")
                    .append("Нативные библ.: ").append(nativeDir).append("\n")
                    .append("SHA-256 подписи: ").append(sigHash).append("\n")
                    .append("APK: ").append(ai.sourceDir).append("\n")
                    .append("Data: ").append(ai.dataDir).append("\n")
                    .append("Установлено: ").append(sdf.format(new Date(pi.firstInstallTime))).append("\n")
                    .append("Обновлено: ").append(sdf.format(new Date(pi.lastUpdateTime))).append("\n\n")
                    .append("--- Компоненты ---\n")
                    .append("Activities: ").append(actCount).append(" | Services: ").append(srvCount)
                    .append(" | Receivers: ").append(rcvCount).append(" | Providers: ").append(prvCount).append("\n\n")
                    .append("--- Запрошенные разрешения ---\n");

                  if (pi.requestedPermissions != null && pi.requestedPermissions.length > 0) {
                      for (String perm : pi.requestedPermissions) {
                          boolean dangerous = false;
                          try {
                              PermissionInfo pInfo = pm.getPermissionInfo(perm, 0);
                              dangerous = (pInfo.protectionLevel & PermissionInfo.PROTECTION_MASK_BASE) == PermissionInfo.PROTECTION_DANGEROUS;
                          } catch (Exception ignored) {}
                          sb.append("• ").append(perm.replace("android.permission.", ""))
                            .append(dangerous ? " [ОПАСНОЕ]\n" : "\n");
                      }
                  } else {
                      sb.append("Нет разрешений\n");
                  }

                  details.setText(sb.toString());
                  layout.addView(details);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(layout);

                  new AlertDialog.Builder(this)
                          .setTitle(item.name)
                          .setView(scroll)
                          .setPositiveButton("Закрыть", null)
                          .setNeutralButton("Настройки ОС", (d, w) -> {
                              Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.parse("package:" + item.pkg));
                              startActivity(intent);
                          })
                          .setNegativeButton("Удалить", (d, w) -> confirmDeleteApp(item))
                          .show();
              }

              private void showExportedActivitiesDialog(PackageInfo pi) {
                  List<String> exported = new ArrayList<>();
                  if (pi.activities != null) {
                      for (ActivityInfo ai : pi.activities) {
                          if (ai.exported) exported.add(ai.name);
                      }
                  }
                  if (exported.isEmpty()) {
                      Toast.makeText(this, "Открытых (exported) Activity не найдено", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  String[] arr = exported.toArray(new String[0]);
                  new AlertDialog.Builder(this)
                          .setTitle("Запуск Activity (" + arr.length + ")")
                          .setItems(arr, (d, which) -> {
                              try {
                                  Intent i = new Intent();
                                  i.setComponent(new ComponentName(pi.packageName, arr[which]));
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                              } catch (Exception e) {
                                  Toast.makeText(this, "Не удалось запустить: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setPositiveButton("Закрыть", null)
                          .show();
              }

              private String getSignatureSha256(PackageInfo pi) {
                  try {
                      if (pi.signatures != null && pi.signatures.length > 0) {
                          Signature sig = pi.signatures[0];
                          MessageDigest md = MessageDigest.getInstance("SHA-256");
                          byte[] d = md.digest(sig.toByteArray());
                          StringBuilder sb = new StringBuilder();
                          for (int i = 0; i < Math.min(12, d.length); i++) {
                              sb.append(String.format("%02X:", d[i]));
                          }
                          return sb.substring(0, sb.length() - 1) + "...";
                      }
                  } catch (Exception ignored) {}
                  return "Н/Д";
              }

              // Встроенный микро-декодер бинарного AndroidManifest.xml напрямую из APK (0 библиотек)
              private void showManifestViewer(String apkPath) {
                  new Thread(() -> {
                      String text = extractManifestStrings(apkPath);
                      runOnUiThread(() -> {
                          TextView tv = new TextView(this);
                          tv.setPadding(24, 24, 24, 24);
                          tv.setTextSize(11f);
                          tv.setText(text);
                          ScrollView sv = new ScrollView(this);
                          sv.addView(tv);
                          new AlertDialog.Builder(this)
                                  .setTitle("AndroidManifest.xml")
                                  .setView(sv)
                                  .setPositiveButton("Закрыть", null)
                                  .show();
                      });
                  }).start();
              }

              private String extractManifestStrings(String apkPath) {
                  try (ZipFile zip = new ZipFile(apkPath)) {
                      ZipEntry entry = zip.getEntry("AndroidManifest.xml");
                      if (entry == null) return "Манифест не найден";
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (InputStream is = zip.getInputStream(entry)) {
                          byte[] buf = new byte[8192];
                          int r;
                          while ((r = is.read(buf)) > 0) baos.write(buf, 0, r);
                      }
                      byte[] data = baos.toByteArray();
                      ByteBuffer bb = ByteBuffer.wrap(data).order(ByteOrder.LITTLE_ENDIAN);
                      if (bb.remaining() < 24) return "Пустой манифест";

                      // Читаем пул строк бинарного AXML
                      bb.position(8);
                      int chunkType = bb.getShort() & 0xFFFF;
                      int headerSize = bb.getShort() & 0xFFFF;
                      int chunkSize = bb.getInt();
                      int stringCount = bb.getInt();
                      bb.getInt(); // styleCount
                      int flags = bb.getInt();
                      int stringsStart = bb.getInt();
                      boolean isUtf8 = (flags & 0x100) != 0;

                      int[] offsets = new int[stringCount];
                      for (int i = 0; i < stringCount; i++) {
                          offsets[i] = bb.getInt();
                      }

                      int base = 8 + stringsStart;
                      StringBuilder out = new StringBuilder();
                      for (int i = 0; i < stringCount; i++) {
                          int pos = base + offsets[i];
                          if (pos >= data.length) continue;
                          String s;
                          if (isUtf8) {
                              int u16len = data[pos++] & 0xFF;
                              if ((u16len & 0x80) != 0) pos++;
                              int u8len = data[pos++] & 0xFF;
                              if ((u8len & 0x80) != 0) u8len = ((u8len & 0x7F) << 8) | (data[pos++] & 0xFF);
                              s = new String(data, pos, Math.min(u8len, data.length - pos), "UTF-8");
                          } else {
                              int u16len = (data[pos] & 0xFF) | ((data[pos + 1] & 0xFF) << 8);
                              pos += 2;
                              s = new String(data, pos, Math.min(u16len * 2, data.length - pos), "UTF-16LE");
                          }
                          if (s.length() > 1 && !s.startsWith("http")) {
                              out.append(s).append("\n");
                          }
                      }
                      return out.toString();
                  } catch (Exception e) {
                      return "Ошибка чтения манифеста: " + e.getMessage();
                  }
              }

              private String fmt(long bytes) {
                  return Formatter.formatFileSize(this, bytes);
              }
          }
