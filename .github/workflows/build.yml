name: Build UltraSmall APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Project Files Automatically
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiniStorage"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/mini/storage

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mini.storage'
              compileSdk 35
              defaultConfig {
                  applicationId "com.mini.storage"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <application
                  android:label="MiniStorage"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mini/storage/MainActivity.java
          package com.mini.storage;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.AppOpsManager;
          import android.app.usage.StorageStats;
          import android.app.usage.StorageStatsManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Process;
          import android.os.storage.StorageManager;
          import android.provider.DocumentsContract;
          import android.provider.Settings;
          import android.text.format.Formatter;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ScrollView;
          import android.widget.TabHost;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {

              private static final int REQ_SAF_DATA = 101;
              private static final String PREF_SAF_URI = "saf_data_uri";

              static class AppItem {
                  String name;
                  String pkg;
                  Drawable icon;
                  long totalAppSize;
                  long apkOnlySize;
                  long folderSize;
                  PackageInfo pkgInfo;
              }

              private final List<AppItem> appList = new ArrayList<>();
              private BaseAdapter adapterTab1;
              private BaseAdapter adapterTab2;
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  statusText = new TextView(this);
                  statusText.setPadding(16, 12, 16, 12);
                  statusText.setText("Загрузка...");
                  root.addView(statusText);

                  LinearLayout btnBar = new LinearLayout(this);
                  btnBar.setOrientation(LinearLayout.HORIZONTAL);

                  Button permBtn = new Button(this);
                  permBtn.setText("1. Права");
                  permBtn.setOnClickListener(v -> requestGeneralPermissions());
                  btnBar.addView(permBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button safBtn = new Button(this);
                  safBtn.setText("2. Доступ к data");
                  safBtn.setOnClickListener(v -> requestSafDataFolder());
                  btnBar.addView(safBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button filesBtn = new Button(this);
                  filesBtn.setText("Проводник");
                  filesBtn.setOnClickListener(v -> openSystemFilesApp());
                  btnBar.addView(filesBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  root.addView(btnBar);

                  TabHost tabHost = new TabHost(this, null);
                  tabHost.setId(android.R.id.tabhost);
                  LinearLayout tabLayout = new LinearLayout(this);
                  tabLayout.setOrientation(LinearLayout.VERTICAL);

                  android.widget.TabWidget tabWidget = new android.widget.TabWidget(this);
                  tabWidget.setId(android.R.id.tabs);
                  tabLayout.addView(tabWidget);

                  android.widget.FrameLayout tabContent = new android.widget.FrameLayout(this);
                  tabContent.setId(android.R.id.tabcontent);
                  tabLayout.addView(tabContent);
                  tabHost.addView(tabLayout);

                  ListView listView1 = new ListView(this);
                  ListView listView2 = new ListView(this);

                  adapterTab1 = createAdapter(true);
                  adapterTab2 = createAdapter(false);
                  listView1.setAdapter(adapterTab1);
                  listView2.setAdapter(adapterTab2);

                  tabHost.setup();
                  tabHost.addTab(tabHost.newTabSpec("t1").setIndicator("Вес + Папки").setContent(tag -> listView1));
                  tabHost.addTab(tabHost.newTabSpec("t2").setIndicator("Пакеты (без папок)").setContent(tag -> listView2));

                  root.addView(tabHost);
                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadAppsAsync();
              }

              private void requestGeneralPermissions() {
                  if (!hasUsageStatsPermission()) {
                      startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          } catch (Exception e) {
                              startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                          }
                      }
                  } else {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 100);
                  }
              }

              private void requestSafDataFolder() {
                  try {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                              | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                              | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Uri uri = DocumentsContract.buildDocumentUri(
                                  "com.android.externalstorage.documents", "primary:Android/data");
                          intent.putExtra(DocumentsContract.EXTRA_INITIAL_URI, uri);
                      }
                      startActivityForResult(intent, REQ_SAF_DATA);
                  } catch (Exception e) {
                      Toast.makeText(this, "Ошибка SAF: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }

              private void openSystemFilesApp() {
                  String[] pkgs = {"com.google.android.documentsui", "com.android.documentsui"};
                  for (String p : pkgs) {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW);
                          i.setComponent(new ComponentName(p, "com.android.documentsui.files.FilesActivity"));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return;
                      } catch (Exception ignored) {}
                  }
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.parse("content://com.android.externalstorage.documents/root/primary"),
                              DocumentsContract.Document.MIME_TYPE_DIR);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть встроенный проводник", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_SAF_DATA && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri treeUri = data.getData();
                      getContentResolver().takePersistableUriPermission(treeUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getSharedPreferences("prefs", MODE_PRIVATE).edit().putString(PREF_SAF_URI, treeUri.toString()).apply();
                      Toast.makeText(this, "Доступ к папке получен!", Toast.LENGTH_SHORT).show();
                      loadAppsAsync();
                  }
              }

              private boolean hasUsageStatsPermission() {
                  AppOpsManager appOps = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                  int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), getPackageName());
                  return mode == AppOpsManager.MODE_ALLOWED;
              }

              private void loadAppsAsync() {
                  statusText.setText("Сканирование приложений и папок...");
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      List<PackageInfo> packages = pm.getInstalledPackages(0);
                      List<AppItem> temp = new ArrayList<>();
                      File extDir = Environment.getExternalStorageDirectory();
                      boolean hasUsage = hasUsageStatsPermission();

                      Map<String, Long> safDataSizes = scanSafDataTree();

                      for (PackageInfo pi : packages) {
                          if (pi.applicationInfo == null) continue;
                          ApplicationInfo ai = pi.applicationInfo;

                          AppItem item = new AppItem();
                          item.pkgInfo = pi;
                          item.pkg = pi.packageName;
                          item.name = ai.loadLabel(pm).toString();
                          item.icon = ai.loadIcon(pm);

                          long apkBytes = new File(ai.sourceDir).length();
                          if (ai.splitSourceDirs != null) {
                              for (String split : ai.splitSourceDirs) {
                                  apkBytes += new File(split).length();
                              }
                          }
                          item.apkOnlySize = apkBytes;
                          item.totalAppSize = apkBytes;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && hasUsage) {
                              try {
                                  StorageStatsManager ssm = (StorageStatsManager) getSystemService(Context.STORAGE_STATS_SERVICE);
                                  StorageStats stats = ssm.queryStatsForPackage(StorageManager.UUID_DEFAULT, pi.packageName, Process.myUserHandle());
                                  item.apkOnlySize = stats.getAppBytes();
                                  item.totalAppSize = stats.getAppBytes() + stats.getDataBytes() + stats.getCacheBytes();
                              } catch (Exception ignored) {}
                          }

                          long dataDirSize = getFolderSize(new File(extDir, "Android/data/" + pi.packageName));
                          if (dataDirSize == 0 && safDataSizes.containsKey(pi.packageName)) {
                              dataDirSize = safDataSizes.get(pi.packageName);
                          }
                          long obbDirSize = getFolderSize(new File(extDir, "Android/obb/" + pi.packageName));
                          long mediaDirSize = getFolderSize(new File(extDir, "Android/media/" + pi.packageName));

                          item.folderSize = dataDirSize + obbDirSize + mediaDirSize;
                          temp.add(item);
                      }

                      Collections.sort(temp, (a, b) -> Long.compare(
                              Math.max(b.totalAppSize, b.apkOnlySize + b.folderSize),
                              Math.max(a.totalAppSize, a.apkOnlySize + a.folderSize)));

                      runOnUiThread(() -> {
                          appList.clear();
                          appList.addAll(temp);
                          statusText.setText("Приложений: " + appList.size() + (hasUsage ? "" : " (Выдайте Права для точного веса)"));
                          adapterTab1.notifyDataSetChanged();
                          adapterTab2.notifyDataSetChanged();
                      });
                  }).start();
              }

              private Map<String, Long> scanSafDataTree() {
                  Map<String, Long> map = new HashMap<>();
                  SharedPreferences prefs = getSharedPreferences("prefs", MODE_PRIVATE);
                  String uriStr = prefs.getString(PREF_SAF_URI, null);
                  if (uriStr == null) return map;

                  try {
                      Uri treeUri = Uri.parse(uriStr);
                      String rootDocId = DocumentsContract.getTreeDocumentId(treeUri);
                      Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, rootDocId);

                      try (Cursor c = getContentResolver().query(childrenUri, new String[]{
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                              DocumentsContract.Document.COLUMN_MIME_TYPE}, null, null, null)) {
                          if (c != null) {
                              while (c.moveToNext()) {
                                  String docId = c.getString(0);
                                  String pkgName = c.getString(1);
                                  String mime = c.getString(2);
                                  if (DocumentsContract.Document.MIME_TYPE_DIR.equals(mime)) {
                                      map.put(pkgName, getSafDirSize(treeUri, docId));
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return map;
              }

              private long getSafDirSize(Uri treeUri, String parentDocId) {
                  long total = 0;
                  Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, parentDocId);
                  try (Cursor c = getContentResolver().query(childrenUri, new String[]{
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_MIME_TYPE,
                          DocumentsContract.Document.COLUMN_SIZE}, null, null, null)) {
                      if (c != null) {
                          while (c.moveToNext()) {
                              String docId = c.getString(0);
                              String mime = c.getString(1);
                              long size = c.isNull(2) ? 0 : c.getLong(2);
                              if (DocumentsContract.Document.MIME_TYPE_DIR.equals(mime)) {
                                  total += getSafDirSize(treeUri, docId);
                              } else {
                                  total += size;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return total;
              }

              private long getFolderSize(File dir) {
                  if (dir == null || !dir.exists()) return 0;
                  long size = 0;
                  File[] files = dir.listFiles();
                  if (files != null) {
                      for (File f : files) {
                          size += f.isDirectory() ? getFolderSize(f) : f.length();
                      }
                  }
                  return size;
              }

              private BaseAdapter createAdapter(boolean fullMode) {
                  return new BaseAdapter() {
                      @Override
                      public int getCount() { return appList.size(); }
                      @Override
                      public Object getItem(int pos) { return appList.get(pos); }
                      @Override
                      public long getItemId(int pos) { return pos; }

                      @Override
                      public View getView(int pos, View convertView, ViewGroup parent) {
                          AppItem item = appList.get(pos);

                          LinearLayout row = new LinearLayout(MainActivity.this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(16, 14, 16, 14);
                          row.setGravity(Gravity.CENTER_VERTICAL);

                          ImageView icon = new ImageView(MainActivity.this);
                          icon.setImageDrawable(item.icon);
                          LinearLayout.LayoutParams iconLp = new LinearLayout.LayoutParams(90, 90);
                          iconLp.rightMargin = 16;
                          row.addView(icon, iconLp);

                          TextView text = new TextView(MainActivity.this);
                          LinearLayout.LayoutParams textLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);

                          if (fullMode) {
                              String info = item.name + "\nВсего: " + fmt(item.totalAppSize);
                              if (item.folderSize > 0) {
                                  info += " | Папки: " + fmt(item.folderSize);
                              }
                              text.setText(info);
                              row.addView(text, textLp);

                              Button delBtn = new Button(MainActivity.this);
                              delBtn.setText("Удалить");
                              delBtn.setOnClickListener(v -> confirmDelete(item));
                              row.addView(delBtn);
                          } else {
                              text.setText(item.name + "\n" + item.pkg + "\nВес без папок: " + fmt(item.apkOnlySize));
                              row.addView(text, textLp);
                          }

                          row.setOnClickListener(v -> showDetailsDialog(item));
                          return row;
                      }
                  };
              }

              private void confirmDelete(AppItem item) {
                  new AlertDialog.Builder(this)
                          .setTitle("Удаление")
                          .setMessage("Вы действительно хотите удалить «" + item.name + "» (" + item.pkg + ")?")
                          .setPositiveButton("Удалить", (d, w) -> {
                              Intent intent = new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + item.pkg));
                              startActivity(intent);
                          })
                          .setNegativeButton("Отмена", null)
                          .show();
              }

              private void showDetailsDialog(AppItem item) {
                  PackageInfo pi = item.pkgInfo;
                  ApplicationInfo ai = pi.applicationInfo;

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 32, 32, 32);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  ImageView bigIcon = new ImageView(this);
                  bigIcon.setImageDrawable(item.icon);
                  layout.addView(bigIcon, new LinearLayout.LayoutParams(240, 240));

                  TextView details = new TextView(this);
                  details.setPadding(0, 24, 0, 0);
                  SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());

                  long vCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P ? pi.getLongVersionCode() : pi.versionCode;
                  int minSdk = Build.VERSION.SDK_INT >= Build.VERSION_CODES.N ? ai.minSdkVersion : 0;
                  boolean isSystem = (ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0;

                  String techInfo = "Имя: " + item.name + "\n" +
                          "Пакет: " + item.pkg + "\n" +
                          "Версия: " + pi.versionName + " (" + vCode + ")\n" +
                          "Вес пакета (без папок): " + fmt(item.apkOnlySize) + "\n" +
                          "Общий вес (с данными и кэшем): " + fmt(item.totalAppSize) + "\n" +
                          "Папки в общей памяти: " + fmt(item.folderSize) + "\n\n" +
                          "--- Техническая информация ---\n" +
                          "Target SDK: " + ai.targetSdkVersion + " | Min SDK: " + minSdk + "\n" +
                          "UID: " + ai.uid + " | Системное: " + (isSystem ? "Да" : "Нет") + "\n" +
                          "APK: " + ai.sourceDir + "\n" +
                          "Data Dir: " + ai.dataDir + "\n" +
                          "Установлено: " + sdf.format(new Date(pi.firstInstallTime)) + "\n" +
                          "Обновлено: " + sdf.format(new Date(pi.lastUpdateTime));

                  details.setText(techInfo);
                  layout.addView(details);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(layout);

                  new AlertDialog.Builder(this)
                          .setTitle("Информация о приложении")
                          .setView(scroll)
                          .setPositiveButton("Закрыть", null)
                          .setNeutralButton("Удалить", (d, w) -> confirmDelete(item))
                          .show();
              }

              private String fmt(long bytes) {
                  return Formatter.formatFileSize(this, bytes);
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniStorage-APK
          path: app/build/outputs/apk/release/*.apk
