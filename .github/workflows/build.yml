name: Build UltraSmall APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Project Files Automatically
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiniStorage"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/mini/storage

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mini.storage'
              compileSdk 35
              defaultConfig {
                  applicationId "com.mini.storage"
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <application
                  android:label="MiniStorage"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mini/storage/MainActivity.java
          package com.mini.storage;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.AppOpsManager;
          import android.app.usage.StorageStats;
          import android.app.usage.StorageStatsManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Process;
          import android.os.storage.StorageManager;
          import android.provider.DocumentsContract;
          import android.provider.Settings;
          import android.text.format.Formatter;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ScrollView;
          import android.widget.TabHost;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {

              static class AppItem {
                  String name;
                  String pkg;
                  Drawable icon;
                  long totalAppSize; // Вес со всеми данными и кэшем
                  long apkOnlySize;  // Только вес пакета (APK)
                  long dataSize;
                  long cacheSize;
                  PackageInfo pkgInfo;
              }

              static class FolderItem {
                  String name;
                  File file;
                  long size;
                  int itemCount;
                  boolean isDir;
              }

              private final List<AppItem> appList = new ArrayList<>();
              private final List<FolderItem> folderList = new ArrayList<>();

              private BaseAdapter adapterApps;
              private BaseAdapter adapterFolders;
              private BaseAdapter adapterPkgs;

              private TextView statusText;
              private Button sortBtn;
              private Button upFolderBtn;

              // 0: Вес (убыв), 1: Вес (возр), 2: Имя (А-Я), 3: Имя (Я-А)
              private int sortMode = 0;
              private final String[] sortLabels = {
                  "Сорт: Вес ↓", "Сорт: Вес ↑", "Сорт: А-Я", "Сорт: Я-А"
              };

              private File currentFolder;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  currentFolder = Environment.getExternalStorageDirectory();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  statusText = new TextView(this);
                  statusText.setPadding(16, 12, 16, 8);
                  statusText.setText("Загрузка...");
                  root.addView(statusText);

                  // Панель управления: Права | Сортировка | Проводник
                  LinearLayout btnBar = new LinearLayout(this);
                  btnBar.setOrientation(LinearLayout.HORIZONTAL);

                  Button permBtn = new Button(this);
                  permBtn.setText("Права");
                  permBtn.setOnClickListener(v -> requestGeneralPermissions());
                  btnBar.addView(permBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  sortBtn = new Button(this);
                  sortBtn.setText(sortLabels[sortMode]);
                  sortBtn.setOnClickListener(v -> {
                      sortMode = (sortMode + 1) % 4;
                      sortBtn.setText(sortLabels[sortMode]);
                      applySorting();
                  });
                  btnBar.addView(sortBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.3f));

                  Button filesBtn = new Button(this);
                  filesBtn.setText("Проводник");
                  filesBtn.setOnClickListener(v -> openSystemFilesApp());
                  btnBar.addView(filesBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  root.addView(btnBar);

                  // Вкладки: Приложения | Папки | Пакеты
                  TabHost tabHost = new TabHost(this, null);
                  tabHost.setId(android.R.id.tabhost);
                  LinearLayout tabLayout = new LinearLayout(this);
                  tabLayout.setOrientation(LinearLayout.VERTICAL);

                  android.widget.TabWidget tabWidget = new android.widget.TabWidget(this);
                  tabWidget.setId(android.R.id.tabs);
                  tabLayout.addView(tabWidget);

                  android.widget.FrameLayout tabContent = new android.widget.FrameLayout(this);
                  tabContent.setId(android.R.id.tabcontent);
                  tabLayout.addView(tabContent);
                  tabHost.addView(tabLayout);

                  // Вкладка 1: Приложения
                  ListView listApps = new ListView(this);
                  adapterApps = createAppAdapter(true);
                  listApps.setAdapter(adapterApps);

                  // Вкладка 2: Папки (с кнопкой возврата на уровень выше)
                  LinearLayout folderTabLayout = new LinearLayout(this);
                  folderTabLayout.setOrientation(LinearLayout.VERTICAL);

                  upFolderBtn = new Button(this);
                  upFolderBtn.setText("⬆ Наверх (Корень памяти)");
                  upFolderBtn.setVisibility(View.GONE);
                  upFolderBtn.setOnClickListener(v -> {
                      File rootDir = Environment.getExternalStorageDirectory();
                      if (currentFolder != null && !currentFolder.equals(rootDir) && currentFolder.getParentFile() != null) {
                          currentFolder = currentFolder.getParentFile();
                          loadFoldersAsync();
                      }
                  });
                  folderTabLayout.addView(upFolderBtn);

                  ListView listFolders = new ListView(this);
                  adapterFolders = createFolderAdapter();
                  listFolders.setAdapter(adapterFolders);
                  folderTabLayout.addView(listFolders, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  // Вкладка 3: Пакеты (без данных и папок)
                  ListView listPkgs = new ListView(this);
                  adapterPkgs = createAppAdapter(false);
                  listPkgs.setAdapter(adapterPkgs);

                  tabHost.setup();
                  tabHost.addTab(tabHost.newTabSpec("t_apps").setIndicator("Приложения").setContent(tag -> listApps));
                  tabHost.addTab(tabHost.newTabSpec("t_folders").setIndicator("Папки").setContent(tag -> folderTabLayout));
                  tabHost.addTab(tabHost.newTabSpec("t_pkgs").setIndicator("Пакеты").setContent(tag -> listPkgs));

                  root.addView(tabHost);
                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadAllAsync();
              }

              private void requestGeneralPermissions() {
                  if (!hasUsageStatsPermission()) {
                      startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          } catch (Exception e) {
                              startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                          }
                      }
                  } else {
                      requestPermissions(new String[]{
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, 100);
                  }
              }

              private void openSystemFilesApp() {
                  String[] pkgs = {"com.google.android.documentsui", "com.android.documentsui"};
                  for (String p : pkgs) {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW);
                          i.setComponent(new ComponentName(p, "com.android.documentsui.files.FilesActivity"));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return;
                      } catch (Exception ignored) {}
                  }
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.parse("content://com.android.externalstorage.documents/root/primary"),
                              DocumentsContract.Document.MIME_TYPE_DIR);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть проводник", Toast.LENGTH_SHORT).show();
                  }
              }

              private boolean hasUsageStatsPermission() {
                  AppOpsManager appOps = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                  int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), getPackageName());
                  return mode == AppOpsManager.MODE_ALLOWED;
              }

              private void loadAllAsync() {
                  loadAppsAsync();
                  loadFoldersAsync();
              }

              private void loadAppsAsync() {
                  statusText.setText("Сканирование приложений и папок...");
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      List<PackageInfo> packages = pm.getInstalledPackages(0);
                      List<AppItem> tempApps = new ArrayList<>();
                      boolean hasUsage = hasUsageStatsPermission();

                      for (PackageInfo pi : packages) {
                          if (pi.applicationInfo == null) continue;
                          ApplicationInfo ai = pi.applicationInfo;

                          AppItem item = new AppItem();
                          item.pkgInfo = pi;
                          item.pkg = pi.packageName;
                          item.name = ai.loadLabel(pm).toString();
                          item.icon = ai.loadIcon(pm);

                          long apkBytes = new File(ai.sourceDir).length();
                          if (ai.splitSourceDirs != null) {
                              for (String split : ai.splitSourceDirs) {
                                  apkBytes += new File(split).length();
                              }
                          }
                          item.apkOnlySize = apkBytes;
                          item.totalAppSize = apkBytes;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && hasUsage) {
                              try {
                                  StorageStatsManager ssm = (StorageStatsManager) getSystemService(Context.STORAGE_STATS_SERVICE);
                                  StorageStats stats = ssm.queryStatsForPackage(StorageManager.UUID_DEFAULT, pi.packageName, Process.myUserHandle());
                                  item.apkOnlySize = stats.getAppBytes();
                                  item.dataSize = stats.getDataBytes();
                                  item.cacheSize = stats.getCacheBytes();
                                  item.totalAppSize = stats.getAppBytes() + stats.getDataBytes() + stats.getCacheBytes();
                              } catch (Exception ignored) {}
                          }
                          tempApps.add(item);
                      }

                      runOnUiThread(() -> {
                          appList.clear();
                          appList.addAll(tempApps);
                          applySorting();
                          updateStatusBanner();
                      });
                  }).start();
              }

              private void loadFoldersAsync() {
                  new Thread(() -> {
                      if (currentFolder == null) {
                          currentFolder = Environment.getExternalStorageDirectory();
                      }
                      File[] files = currentFolder.listFiles();
                      List<FolderItem> tempFolders = new ArrayList<>();

                      if (files != null) {
                          for (File f : files) {
                              FolderItem fi = new FolderItem();
                              fi.name = f.getName();
                              fi.file = f;
                              fi.isDir = f.isDirectory();
                              if (fi.isDir) {
                                  File[] sub = f.listFiles();
                                  fi.itemCount = sub != null ? sub.length : 0;
                                  fi.size = getFolderSize(f);
                              } else {
                                  fi.itemCount = 1;
                                  fi.size = f.length();
                              }
                              tempFolders.add(fi);
                          }
                      }

                      runOnUiThread(() -> {
                          folderList.clear();
                          folderList.addAll(tempFolders);
                          File rootDir = Environment.getExternalStorageDirectory();
                          if (currentFolder.equals(rootDir)) {
                              upFolderBtn.setVisibility(View.GONE);
                          } else {
                              upFolderBtn.setVisibility(View.VISIBLE);
                              upFolderBtn.setText("⬆ Назад (из " + currentFolder.getName() + ")");
                          }
                          applySorting();
                          updateStatusBanner();
                      });
                  }).start();
              }

              private void updateStatusBanner() {
                  File ext = Environment.getExternalStorageDirectory();
                  long totalSpace = ext.getTotalSpace();
                  long freeSpace = ext.getFreeSpace();
                  long usedSpace = totalSpace - freeSpace;
                  statusText.setText("Приложений: " + appList.size() + " | Папок: " + folderList.size() +
                          " | Занято: " + fmt(usedSpace) + " из " + fmt(totalSpace));
              }

              private void applySorting() {
                  // Сортировка приложений
                  Collections.sort(appList, (a, b) -> {
                      switch (sortMode) {
                          case 1: return Long.compare(a.totalAppSize, b.totalAppSize);
                          case 2: return a.name.compareToIgnoreCase(b.name);
                          case 3: return b.name.compareToIgnoreCase(a.name);
                          default: return Long.compare(b.totalAppSize, a.totalAppSize);
                      }
                  });

                  // Сортировка папок
                  Collections.sort(folderList, (a, b) -> {
                      switch (sortMode) {
                          case 1: return Long.compare(a.size, b.size);
                          case 2: return a.name.compareToIgnoreCase(b.name);
                          case 3: return b.name.compareToIgnoreCase(a.name);
                          default: return Long.compare(b.size, a.size);
                      }
                  });

                  if (adapterApps != null) adapterApps.notifyDataSetChanged();
                  if (adapterFolders != null) adapterFolders.notifyDataSetChanged();
                  if (adapterPkgs != null) adapterPkgs.notifyDataSetChanged();
              }

              private long getFolderSize(File dir) {
                  if (dir == null || !dir.exists()) return 0;
                  long size = 0;
                  File[] files = dir.listFiles();
                  if (files != null) {
                      for (File f : files) {
                          size += f.isDirectory() ? getFolderSize(f) : f.length();
                      }
                  }
                  return size;
              }

              private boolean deleteRecursive(File f) {
                  if (f.isDirectory()) {
                      File[] files = f.listFiles();
                      if (files != null) {
                          for (File child : files) {
                              deleteRecursive(child);
                          }
                      }
                  }
                  return f.delete();
              }

              // Адаптер для вкладки 1 (Приложения с полным весом) и вкладки 3 (Пакеты только APK)
              private BaseAdapter createAppAdapter(boolean fullMode) {
                  return new BaseAdapter() {
                      @Override
                      public int getCount() { return appList.size(); }
                      @Override
                      public Object getItem(int pos) { return appList.get(pos); }
                      @Override
                      public long getItemId(int pos) { return pos; }

                      @Override
                      public View getView(int pos, View convertView, ViewGroup parent) {
                          AppItem item = appList.get(pos);

                          LinearLayout row = new LinearLayout(MainActivity.this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(16, 14, 16, 14);
                          row.setGravity(Gravity.CENTER_VERTICAL);

                          ImageView icon = new ImageView(MainActivity.this);
                          icon.setImageDrawable(item.icon);
                          LinearLayout.LayoutParams iconLp = new LinearLayout.LayoutParams(90, 90);
                          iconLp.rightMargin = 16;
                          row.addView(icon, iconLp);

                          TextView text = new TextView(MainActivity.this);
                          LinearLayout.LayoutParams textLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);

                          if (fullMode) {
                              String info = item.name + "\nВсего: " + fmt(item.totalAppSize);
                              if (item.dataSize > 0 || item.cacheSize > 0) {
                                  info += "\nAPK: " + fmt(item.apkOnlySize) + " | Данные: " + fmt(item.dataSize);
                              }
                              text.setText(info);
                              row.addView(text, textLp);

                              Button delBtn = new Button(MainActivity.this);
                              delBtn.setText("Удалить");
                              delBtn.setOnClickListener(v -> confirmDeleteApp(item));
                              row.addView(delBtn);
                          } else {
                              text.setText(item.name + "\n" + item.pkg + "\nВес APK (без папок): " + fmt(item.apkOnlySize));
                              row.addView(text, textLp);
                          }

                          row.setOnClickListener(v -> showDetailsDialog(item));
                          return row;
                      }
                  };
              }

              // Адаптер для вкладки 2 (Папки и файлы во внутренней памяти)
              private BaseAdapter createFolderAdapter() {
                  return new BaseAdapter() {
                      @Override
                      public int getCount() { return folderList.size(); }
                      @Override
                      public Object getItem(int pos) { return folderList.get(pos); }
                      @Override
                      public long getItemId(int pos) { return pos; }

                      @Override
                      public View getView(int pos, View convertView, ViewGroup parent) {
                          FolderItem item = folderList.get(pos);

                          LinearLayout row = new LinearLayout(MainActivity.this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(16, 16, 16, 16);
                          row.setGravity(Gravity.CENTER_VERTICAL);

                          TextView iconTxt = new TextView(MainActivity.this);
                          iconTxt.setText(item.isDir ? "📁" : "📄");
                          iconTxt.setTextSize(24f);
                          iconTxt.setPadding(0, 0, 20, 0);
                          row.addView(iconTxt);

                          TextView text = new TextView(MainActivity.this);
                          LinearLayout.LayoutParams textLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                          String subInfo = item.isDir ? ("Объектов внутри: " + item.itemCount) : "Файл";
                          text.setText(item.name + "\nВес: " + fmt(item.size) + " | " + subInfo);
                          row.addView(text, textLp);

                          Button delBtn = new Button(MainActivity.this);
                          delBtn.setText("Удалить");
                          delBtn.setOnClickListener(v -> confirmDeleteFolder(item));
                          row.addView(delBtn);

                          row.setOnClickListener(v -> {
                              if (item.isDir) {
                                  currentFolder = item.file;
                                  loadFoldersAsync();
                              } else {
                                  Toast.makeText(MainActivity.this, item.file.getAbsolutePath(), Toast.LENGTH_SHORT).show();
                              }
                          });

                          return row;
                      }
                  };
              }

              private void confirmDeleteApp(AppItem item) {
                  new AlertDialog.Builder(this)
                          .setTitle("Удаление приложения")
                          .setMessage("Удалить «" + item.name + "» (" + item.pkg + ")?")
                          .setPositiveButton("Удалить", (d, w) -> {
                              Intent intent = new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + item.pkg));
                              startActivity(intent);
                          })
                          .setNegativeButton("Отмена", null)
                          .show();
              }

              private void confirmDeleteFolder(FolderItem item) {
                  new AlertDialog.Builder(this)
                          .setTitle("Удаление из памяти")
                          .setMessage("Удалить " + (item.isDir ? "папку" : "файл") + " «" + item.name + "» (" + fmt(item.size) + ") навсегда?")
                          .setPositiveButton("Удалить", (d, w) -> {
                              new Thread(() -> {
                                  boolean ok = deleteRecursive(item.file);
                                  runOnUiThread(() -> {
                                      Toast.makeText(this, ok ? "Удалено" : "Ошибка удаления (проверьте Права)", Toast.LENGTH_SHORT).show();
                                      loadFoldersAsync();
                                  });
                              }).start();
                          })
                          .setNegativeButton("Отмена", null)
                          .show();
              }

              private void showDetailsDialog(AppItem item) {
                  PackageInfo pi = item.pkgInfo;
                  ApplicationInfo ai = pi.applicationInfo;

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 32, 32, 32);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  ImageView bigIcon = new ImageView(this);
                  bigIcon.setImageDrawable(item.icon);
                  layout.addView(bigIcon, new LinearLayout.LayoutParams(240, 240));

                  TextView details = new TextView(this);
                  details.setPadding(0, 24, 0, 0);
                  SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());

                  long vCode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P ? pi.getLongVersionCode() : pi.versionCode;
                  int minSdk = Build.VERSION.SDK_INT >= Build.VERSION_CODES.N ? ai.minSdkVersion : 0;
                  boolean isSystem = (ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0;

                  String techInfo = "Имя: " + item.name + "\n" +
                          "Пакет: " + item.pkg + "\n" +
                          "Версия: " + pi.versionName + " (" + vCode + ")\n\n" +
                          "--- Занимаемое место ---\n" +
                          "Всего: " + fmt(item.totalAppSize) + "\n" +
                          "Вес APK (без папок): " + fmt(item.apkOnlySize) + "\n" +
                          "Данные (вкл. Android/data): " + fmt(item.dataSize) + "\n" +
                          "Кэш: " + fmt(item.cacheSize) + "\n\n" +
                          "--- Техническая информация ---\n" +
                          "Target SDK: " + ai.targetSdkVersion + " | Min SDK: " + minSdk + "\n" +
                          "UID: " + ai.uid + " | Системное: " + (isSystem ? "Да" : "Нет") + "\n" +
                          "APK путь: " + ai.sourceDir + "\n" +
                          "Data путь: " + ai.dataDir + "\n" +
                          "Установлено: " + sdf.format(new Date(pi.firstInstallTime)) + "\n" +
                          "Обновлено: " + sdf.format(new Date(pi.lastUpdateTime));

                  details.setText(techInfo);
                  layout.addView(details);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(layout);

                  new AlertDialog.Builder(this)
                          .setTitle("Информация о приложении")
                          .setView(scroll)
                          .setPositiveButton("Закрыть", null)
                          .setNeutralButton("Системные настройки", (d, w) -> {
                              Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.parse("package:" + item.pkg));
                              startActivity(intent);
                          })
                          .setNegativeButton("Удалить", (d, w) -> confirmDeleteApp(item))
                          .show();
              }

              private String fmt(long bytes) {
                  return Formatter.formatFileSize(this, bytes);
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniStorage-APK
          path: app/build/outputs/apk/release/*.apk
