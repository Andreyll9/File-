name: Build UltraSmall APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Project Files Automatically
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiniStorage"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/mini/storage

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mini.storage'
              compileSdk 35
              defaultConfig {
                  applicationId "com.mini.storage"
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName "2.0"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <application
                  android:label="MiniStorage"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="stateHidden|adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mini/storage/MainActivity.java
          package com.mini.storage;

          import android.Manifest;
          import android.app.Activity;
          import android.app.ActivityManager;
          import android.app.AlertDialog;
          import android.app.AppOpsManager;
          import android.app.usage.StorageStats;
          import android.app.usage.StorageStatsManager;
          import android.app.usage.UsageStats;
          import android.app.usage.UsageStatsManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.PermissionInfo;
          import android.content.pm.ProviderInfo;
          import android.content.pm.ServiceInfo;
          import android.content.pm.Signature;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Debug;
          import android.os.Environment;
          import android.os.Process;
          import android.os.StatFs;
          import android.os.storage.StorageManager;
          import android.provider.DocumentsContract;
          import android.provider.Settings;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.text.format.Formatter;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ScrollView;
          import android.widget.TabHost;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.FileReader;
          import java.io.InputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.security.MessageDigest;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          public class MainActivity extends Activity {

              static class AppItem {
                  String name;
                  String pkg;
                  Drawable icon;
                  long totalAppSize;
                  long apkOnlySize;
                  long dataSize;
                  long cacheSize;
                  long installTime;
                  boolean isSystem;
                  PackageInfo pkgInfo;
              }

              static class FolderItem {
                  String name;
                  File file;
                  long size;
                  int itemCount;
                  boolean isDir;
              }

              static class AnalyzerItem {
                  String title;
                  String subtitle;
                  File file;
                  long size;
                  boolean isHeader;
              }

              static class ProcItem {
                  String name;
                  String pkg;
                  String stateInfo;
                  Drawable icon;
                  int pid;
                  int uid;
                  long ramBytes;
                  long lastActive;
                  boolean isSystem;
              }

              private final List<AppItem> allApps = new ArrayList<>();
              private final List<AppItem> displayApps = new ArrayList<>();

              private final List<FolderItem> allFolders = new ArrayList<>();
              private final List<FolderItem> displayFolders = new ArrayList<>();

              private final List<AnalyzerItem> allAnalyzer = new ArrayList<>();
              private final List<AnalyzerItem> displayAnalyzer = new ArrayList<>();

              private final List<ProcItem> allProcs = new ArrayList<>();
              private final List<ProcItem> displayProcs = new ArrayList<>();

              private final Set<String> selectedApps = new HashSet<>();
              private final Set<File> selectedFiles = new HashSet<>();

              private BaseAdapter adapterApps;
              private BaseAdapter adapterFolders;
              private BaseAdapter adapterPkgs;
              private BaseAdapter adapterAnalyzer;
              private BaseAdapter adapterProcs;

              private TextView statusText;
              private TextView analyzerHeaderText;
              private Button sortBtn;
              private Button filterBtn;
              private Button batchDelBtn;
              private Button upFolderBtn;
              private EditText searchInput;

              private int sortMode = 0;
              private final String[] sortLabels = {
                  "Вес ↓", "Вес ↑", "А-Я", "Я-А", "Кэш ↓", "Новые ↓"
              };

              // 0: Все, 1: Польз., 2: Систем.
              private int appFilterMode = 0;
              private final String[] filterLabels = {
                  "Фильтр: Все", "Фильтр: Польз.", "Фильтр: Сист."
              };

              private String searchQuery = "";
              private File currentFolder;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  currentFolder = Environment.getExternalStorageDirectory();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  statusText = new TextView(this);
                  statusText.setPadding(14, 8, 14, 4);
                  statusText.setTextSize(12f);
                  statusText.setText("Загрузка...");
                  root.addView(statusText);

                  // Ряд 1: Кнопки управления
                  LinearLayout bar1 = new LinearLayout(this);
                  bar1.setOrientation(LinearLayout.HORIZONTAL);

                  Button permBtn = smallBtn("Права");
                  permBtn.setOnClickListener(v -> requestGeneralPermissions());
                  bar1.addView(permBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 0.9f));

                  sortBtn = smallBtn(sortLabels[sortMode]);
                  sortBtn.setOnClickListener(v -> {
                      sortMode = (sortMode + 1) % sortLabels.length;
                      sortBtn.setText(sortLabels[sortMode]);
                      applyFilterAndSort();
                  });
                  bar1.addView(sortBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.1f));

                  filterBtn = smallBtn(filterLabels[appFilterMode]);
                  filterBtn.setOnClickListener(v -> {
                      appFilterMode = (appFilterMode + 1) % filterLabels.length;
                      filterBtn.setText(filterLabels[appFilterMode]);
                      applyFilterAndSort();
                  });
                  bar1.addView(filterBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.3f));

                  Button filesBtn = smallBtn("Файлы");
                  filesBtn.setOnClickListener(v -> openSystemFilesApp());
                  bar1.addView(filesBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 0.9f));

                  root.addView(bar1);

                  // Ряд 2: Поиск + Пакетное удаление
                  LinearLayout bar2 = new LinearLayout(this);
                  bar2.setOrientation(LinearLayout.HORIZONTAL);
                  bar2.setGravity(Gravity.CENTER_VERTICAL);
                  bar2.setPadding(8, 0, 8, 4);

                  searchInput = new EditText(this);
                  searchInput.setHint("Поиск (имя, пакет, файл)...");
                  searchInput.setSingleLine(true);
                  searchInput.setTextSize(13f);
                  searchInput.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {
                          searchQuery = s.toString().trim().toLowerCase(Locale.getDefault());
                          applyFilterAndSort();
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });
                  bar2.addView(searchInput, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  batchDelBtn = smallBtn("Удалить (0)");
                  batchDelBtn.setVisibility(View.GONE);
                  batchDelBtn.setOnClickListener(v -> confirmBatchDelete());
                  bar2.addView(batchDelBtn);

                  root.addView(bar2);

                  // Вкладки
                  TabHost tabHost = new TabHost(this, null);
                  tabHost.setId(android.R.id.tabhost);
                  LinearLayout tabLayout = new LinearLayout(this);
                  tabLayout.setOrientation(LinearLayout.VERTICAL);

                  android.widget.TabWidget tabWidget = new android.widget.TabWidget(this);
                  tabWidget.setId(android.R.id.tabs);
                  tabLayout.addView(tabWidget);

                  android.widget.FrameLayout tabContent = new android.widget.FrameLayout(this);
                  tabContent.setId(android.R.id.tabcontent);
                  tabLayout.addView(tabContent);
                  tabHost.addView(tabLayout);

                  // Вкладка 1: Приложения
                  ListView listApps = new ListView(this);
                  adapterApps = createAppAdapter(true);
                  listApps.setAdapter(adapterApps);

                  // Вкладка 2: Папки
                  LinearLayout folderTabLayout = new LinearLayout(this);
                  folderTabLayout.setOrientation(LinearLayout.VERTICAL);
                  upFolderBtn = smallBtn("⬆ Назад");
                  upFolderBtn.setVisibility(View.GONE);
                  upFolderBtn.setOnClickListener(v -> {
                      File rootDir = Environment.getExternalStorageDirectory();
                      if (currentFolder != null && !currentFolder.equals(rootDir) && currentFolder.getParentFile() != null) {
                          currentFolder = currentFolder.getParentFile();
                          loadFoldersAsync();
                      }
                  });
                  folderTabLayout.addView(upFolderBtn);
                  ListView listFolders = new ListView(this);
                  adapterFolders = createFolderAdapter();
                  listFolders.setAdapter(adapterFolders);
                  folderTabLayout.addView(listFolders, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  // Вкладка 3: Пакеты
                  ListView listPkgs = new ListView(this);
                  adapterPkgs = createAppAdapter(false);
                  listPkgs.setAdapter(adapterPkgs);

                  // Вкладка 4: Анализ памяти (Категории, Топ-100, Дубликаты, Пустые папки и остатки)
                  LinearLayout analyzerLayout = new LinearLayout(this);
                  analyzerLayout.setOrientation(LinearLayout.VERTICAL);

                  analyzerHeaderText = new TextView(this);
                  analyzerHeaderText.setPadding(12, 8, 12, 8);
                  analyzerHeaderText.setTextSize(11.5f);
                  analyzerHeaderText.setText("Нажмите кнопку ниже для глубокого анализа памяти...");
                  analyzerLayout.addView(analyzerHeaderText);

                  LinearLayout anBtnBar = new LinearLayout(this);
                  anBtnBar.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnTopFiles = smallBtn("Топ-100 файлов");
                  btnTopFiles.setOnClickListener(v -> runDeepStorageAnalysis(0));
                  anBtnBar.addView(btnTopFiles, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button btnDupes = smallBtn("Дубликаты");
                  btnDupes.setOnClickListener(v -> runDeepStorageAnalysis(1));
                  anBtnBar.addView(btnDupes, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button btnEmpty = smallBtn("Пустые/Остатки");
                  btnEmpty.setOnClickListener(v -> runDeepStorageAnalysis(2));
                  anBtnBar.addView(btnEmpty, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  analyzerLayout.addView(anBtnBar);

                  ListView listAnalyzer = new ListView(this);
                  adapterAnalyzer = createAnalyzerAdapter();
                  listAnalyzer.setAdapter(adapterAnalyzer);
                  analyzerLayout.addView(listAnalyzer, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  // Вкладка 5: Диспетчер процессов (Свои и Системные)
                  LinearLayout procLayout = new LinearLayout(this);
                  procLayout.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout procBar = new LinearLayout(this);
                  procBar.setOrientation(LinearLayout.HORIZONTAL);

                  Button refreshProcBtn = smallBtn("Обновить процессы");
                  refreshProcBtn.setOnClickListener(v -> loadProcessesAsync());
                  procBar.addView(refreshProcBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button killAllBgBtn = smallBtn("Очистить фон (Все)");
                  killAllBgBtn.setOnClickListener(v -> killAllBackgroundProcesses());
                  procBar.addView(killAllBgBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  procLayout.addView(procBar);

                  ListView listProcs = new ListView(this);
                  adapterProcs = createProcAdapter();
                  listProcs.setAdapter(adapterProcs);
                  procLayout.addView(listProcs, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  tabHost.setup();
                  tabHost.addTab(tabHost.newTabSpec("t1").setIndicator("Прил.").setContent(tag -> listApps));
                  tabHost.addTab(tabHost.newTabSpec("t2").setIndicator("Папки").setContent(tag -> folderTabLayout));
                  tabHost.addTab(tabHost.newTabSpec("t3").setIndicator("Пакеты").setContent(tag -> listPkgs));
                  tabHost.addTab(tabHost.newTabSpec("t4").setIndicator("Анализ").setContent(tag -> analyzerLayout));
                  tabHost.addTab(tabHost.newTabSpec("t5").setIndicator("Процессы").setContent(tag -> procLayout));

                  root.addView(tabHost);
                  setContentView(root);

                  updatePartitionsHeader();
              }

              private Button smallBtn(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(11f);
                  b.setPadding(6, 6, 6, 6);
                  return b;
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadAppsAsync();
                  loadFoldersAsync();
                  loadProcessesAsync();
              }

              private void updateBatchButton() {
                  int total = selectedApps.size() + selectedFiles.size();
                  if (total > 0) {
                      batchDelBtn.setVisibility(View.VISIBLE);
                      batchDelBtn.setText("Удалить (" + total + ")");
                  } else {
                      batchDelBtn.setVisibility(View.GONE);
                  }
              }

              private void confirmBatchDelete() {
                  int appCount = selectedApps.size();
                  int fileCount = selectedFiles.size();
                  new AlertDialog.Builder(this)
                          .setTitle("Пакетное удаление")
                          .setMessage("Выбрано приложений: " + appCount + "\nВыбрано папок/файлов: " + fileCount + "\nПродолжить удаление?")
                          .setPositiveButton("Удалить", (d, w) -> {
                              for (String pkg : new ArrayList<>(selectedApps)) {
                                  Intent intent = new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + pkg));
                                  startActivity(intent);
                              }
                              selectedApps.clear();

                              if (!selectedFiles.isEmpty()) {
                                  new Thread(() -> {
                                      for (File f : new ArrayList<>(selectedFiles)) {
                                          deleteRecursive(f);
                                      }
                                      selectedFiles.clear();
                                      runOnUiThread(() -> {
                                          updateBatchButton();
                                          loadFoldersAsync();
                                          Toast.makeText(this, "Выбранные файлы удалены", Toast.LENGTH_SHORT).show();
                                      });
                                  }).start();
                              } else {
                                  updateBatchButton();
                              }
                          })
                          .setNegativeButton("Отмена", (d, w) -> {
                              selectedApps.clear();
                              selectedFiles.clear();
                              updateBatchButton();
                              applyFilterAndSort();
                          })
                          .show();
              }

              private void requestGeneralPermissions() {
                  if (!hasUsageStatsPermission()) {
                      startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          } catch (Exception e) {
                              startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                          }
                      }
                  } else {
                      requestPermissions(new String[]{
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, 100);
                  }
              }

              private void openSystemFilesApp() {
                  String[] pkgs = {"com.google.android.documentsui", "com.android.documentsui"};
                  for (String p : pkgs) {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW);
                          i.setComponent(new ComponentName(p, "com.android.documentsui.files.FilesActivity"));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return;
                      } catch (Exception ignored) {}
                  }
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.parse("content://com.android.externalstorage.documents/root/primary"),
                              DocumentsContract.Document.MIME_TYPE_DIR);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть проводник", Toast.LENGTH_SHORT).show();
                  }
              }

              private boolean hasUsageStatsPermission() {
                  AppOpsManager appOps = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                  int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), getPackageName());
                  return mode == AppOpsManager.MODE_ALLOWED;
              }

              private void loadAppsAsync() {
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      List<PackageInfo> packages = pm.getInstalledPackages(0);
                      List<AppItem> temp = new ArrayList<>();
                      boolean hasUsage = hasUsageStatsPermission();

                      for (PackageInfo pi : packages) {
                          if (pi.applicationInfo == null) continue;
                          ApplicationInfo ai = pi.applicationInfo;

                          AppItem item = new AppItem();
                          item.pkgInfo = pi;
                          item.pkg = pi.packageName;
                          item.name = ai.loadLabel(pm).toString();
                          item.icon = ai.loadIcon(pm);
                          item.installTime = pi.firstInstallTime;
                          item.isSystem = (ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0;

                          long apkBytes = new File(ai.sourceDir).length();
                          if (ai.splitSourceDirs != null) {
                              for (String split : ai.splitSourceDirs) {
                                  apkBytes += new File(split).length();
                              }
                          }
                          item.apkOnlySize = apkBytes;
                          item.totalAppSize = apkBytes;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && hasUsage) {
                              try {
                                  StorageStatsManager ssm = (StorageStatsManager) getSystemService(Context.STORAGE_STATS_SERVICE);
                                  StorageStats stats = ssm.queryStatsForPackage(StorageManager.UUID_DEFAULT, pi.packageName, Process.myUserHandle());
                                  item.apkOnlySize = stats.getAppBytes();
                                  item.dataSize = stats.getDataBytes();
                                  item.cacheSize = stats.getCacheBytes();
                                  item.totalAppSize = stats.getAppBytes() + stats.getDataBytes() + stats.getCacheBytes();
                              } catch (Exception ignored) {}
                          }
                          temp.add(item);
                      }

                      runOnUiThread(() -> {
                          allApps.clear();
                          allApps.addAll(temp);
                          applyFilterAndSort();
                          updateStatusBanner();
                      });
                  }).start();
              }

              private void loadFoldersAsync() {
                  new Thread(() -> {
                      if (currentFolder == null) {
                          currentFolder = Environment.getExternalStorageDirectory();
                      }
                      File[] files = currentFolder.listFiles();
                      List<FolderItem> temp = new ArrayList<>();

                      if (files != null) {
                          for (File f : files) {
                              FolderItem fi = new FolderItem();
                              fi.name = f.getName();
                              fi.file = f;
                              fi.isDir = f.isDirectory();
                              if (fi.isDir) {
                                  File[] sub = f.listFiles();
                                  fi.itemCount = sub != null ? sub.length : 0;
                                  fi.size = getFolderSize(f);
                              } else {
                                  fi.itemCount = 1;
                                  fi.size = f.length();
                              }
                              temp.add(fi);
                          }
                      }

                      runOnUiThread(() -> {
                          allFolders.clear();
                          allFolders.addAll(temp);
                          File rootDir = Environment.getExternalStorageDirectory();
                          if (currentFolder.equals(rootDir)) {
                              upFolderBtn.setVisibility(View.GONE);
                          } else {
                              upFolderBtn.setVisibility(View.VISIBLE);
                              upFolderBtn.setText("⬆ Назад (из " + currentFolder.getName() + ")");
                          }
                          applyFilterAndSort();
                          updateStatusBanner();
                      });
                  }).start();
              }

              // Загрузка процессов: объединяет ActivityManager (сервисы + процессы), /proc и UsageStats
              private void loadProcessesAsync() {
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                      Map<String, ProcItem> procMap = new HashMap<>();

                      // 1. Активные сервисы
                      try {
                          List<ActivityManager.RunningServiceInfo> services = am.getRunningServices(300);
                          if (services != null) {
                              for (ActivityManager.RunningServiceInfo rsi : services) {
                                  String pkg = rsi.service.getPackageName();
                                  ProcItem pi = procMap.get(pkg);
                                  if (pi == null) {
                                      pi = createProcItem(pm, pkg, rsi.pid, rsi.uid, "Активный сервис (" + rsi.process + ")");
                                      procMap.put(pkg, pi);
                                  }
                              }
                          }
                      } catch (Exception ignored) {}

                      // 2. Запущенные процессы из ActivityManager
                      try {
                          List<ActivityManager.RunningAppProcessInfo> procs = am.getRunningAppProcesses();
                          if (procs != null) {
                              for (ActivityManager.RunningAppProcessInfo rpi : procs) {
                                  String pkg = rpi.pkgList != null && rpi.pkgList.length > 0 ? rpi.pkgList[0] : rpi.processName;
                                  if (!procMap.containsKey(pkg)) {
                                      String imp = importanceToString(rpi.importance);
                                      ProcItem pi = createProcItem(pm, pkg, rpi.pid, rpi.uid, imp + " (PID: " + rpi.pid + ")");
                                      procMap.put(pkg, pi);
                                  }
                              }
                          }
                      } catch (Exception ignored) {}

                      // 3. Чтение доступных процессов из /proc
                      File procDir = new File("/proc");
                      File[] procFiles = procDir.listFiles();
                      if (procFiles != null) {
                          for (File pf : procFiles) {
                              String fn = pf.getName();
                              if (fn.matches("\\d+")) {
                                  try (BufferedReader br = new BufferedReader(new FileReader(new File(pf, "cmdline")))) {
                                      String cmd = br.readLine();
                                      if (cmd != null) {
                                          cmd = cmd.replace("\0", "").trim();
                                          String pkg = cmd.contains(":") ? cmd.substring(0, cmd.indexOf(':')) : cmd;
                                          if (!pkg.isEmpty() && !procMap.containsKey(pkg) && pkg.contains(".")) {
                                              int pid = Integer.parseInt(fn);
                                              ProcItem pi = createProcItem(pm, pkg, pid, 0, "Системный /proc (PID: " + pid + ")");
                                              procMap.put(pkg, pi);
                                          }
                                      }
                                  } catch (Exception ignored) {}
                              }
                          }
                      }

                      // 4. Недавно активные приложения и системные пакеты через UsageStats (за последние 24 часа)
                      if (hasUsageStatsPermission()) {
                          UsageStatsManager usm = (UsageStatsManager) getSystemService(Context.USAGE_STATS_SERVICE);
                          long now = System.currentTimeMillis();
                          List<UsageStats> stats = usm.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, now - 86400_000L, now);
                          if (stats != null) {
                              SimpleDateFormat sdf = new SimpleDateFormat("HH:mm:ss", Locale.getDefault());
                              for (UsageStats us : stats) {
                                  if (us.getLastTimeUsed() > now - 86400_000L) {
                                      String pkg = us.getPackageName();
                                      ProcItem existing = procMap.get(pkg);
                                      if (existing != null) {
                                          existing.lastActive = us.getLastTimeUsed();
                                      } else {
                                          ProcItem pi = createProcItem(pm, pkg, 0, 0,
                                                  "Фон / Активность: " + sdf.format(new Date(us.getLastTimeUsed())));
                                          pi.lastActive = us.getLastTimeUsed();
                                          procMap.put(pkg, pi);
                                      }
                                  }
                              }
                          }
                      }

                      // Дополняем объемом памяти по PID, где система разрешает
                      for (ProcItem item : procMap.values()) {
                          if (item.pid > 0) {
                              try {
                                  Debug.MemoryInfo[] mem = am.getProcessMemoryInfo(new int[]{item.pid});
                                  if (mem != null && mem.length > 0) {
                                      item.ramBytes = mem[0].getTotalPss() * 1024L;
                                  }
                              } catch (Exception ignored) {}
                          }
                      }

                      List<ProcItem> result = new ArrayList<>(procMap.values());
                      Collections.sort(result, (a, b) -> {
                          if (a.pid != b.pid) return Integer.compare(b.pid, a.pid);
                          return Long.compare(b.lastActive, a.lastActive);
                      });

                      runOnUiThread(() -> {
                          allProcs.clear();
                          allProcs.addAll(result);
                          applyFilterAndSort();
                      });
                  }).start();
              }

              private ProcItem createProcItem(PackageManager pm, String pkg, int pid, int uid, String state) {
                  ProcItem item = new ProcItem();
                  item.pkg = pkg;
                  item.pid = pid;
                  item.uid = uid;
                  item.stateInfo = state;
                  try {
                      ApplicationInfo ai = pm.getApplicationInfo(pkg, 0);
                      item.name = ai.loadLabel(pm).toString();
                      item.icon = ai.loadIcon(pm);
                      item.uid = ai.uid;
                      item.isSystem = (ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0;
                  } catch (Exception e) {
                      item.name = pkg;
                      item.icon = getResources().getDrawable(android.R.drawable.sym_def_app_icon);
                      item.isSystem = true;
                  }
                  return item;
              }

              private String importanceToString(int imp) {
                  if (imp <= ActivityManager.RunningAppProcessInfo.IMPORTANCE_FOREGROUND) return "На экране";
                  if (imp <= ActivityManager.RunningAppProcessInfo.IMPORTANCE_VISIBLE) return "Видимый";
                  if (imp <= ActivityManager.RunningAppProcessInfo.IMPORTANCE_SERVICE) return "Сервис";
                  return "Кэш / Фон";
              }

              private void killAllBackgroundProcesses() {
                  new Thread(() -> {
                      ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                      int count = 0;
                      for (AppItem app : allApps) {
                          try {
                              am.killBackgroundProcesses(app.pkg);
                              count++;
                          } catch (Exception ignored) {}
                      }
                      final int c = count;
                      runOnUiThread(() -> {
                          Toast.makeText(this, "Отправлен сигнал остановки фона для " + c + " пакетов", Toast.LENGTH_SHORT).show();
                          loadProcessesAsync();
                      });
                  }).start();
              }

              // Глубокий анализ памяти: 0 = Топ-100 файлов, 1 = Дубликаты, 2 = Пустые папки и остатки
              private void runDeepStorageAnalysis(int mode) {
                  analyzerHeaderText.setText("Сканирование файловой системы, подождите...");
                  new Thread(() -> {
                      File rootDir = Environment.getExternalStorageDirectory();
                      List<File> allFiles = new ArrayList<>();
                      List<File> emptyOrCorpseDirs = new ArrayList<>();
                      long[] catSizes = new long[6]; // 0:Видео, 1:Фото, 2:Аудио, 3:Архивы, 4:APK, 5:Прочее

                      Set<String> installedPkgs = new HashSet<>();
                      for (AppItem a : allApps) installedPkgs.add(a.pkg);

                      collectFilesRecursive(rootDir, allFiles, emptyOrCorpseDirs, catSizes, installedPkgs);

                      List<AnalyzerItem> results = new ArrayList<>();

                      if (mode == 0) {
                          // Топ-100 самых больших файлов
                          Collections.sort(allFiles, (a, b) -> Long.compare(b.length(), a.length()));
                          int limit = Math.min(100, allFiles.size());
                          for (int i = 0; i < limit; i++) {
                              File f = allFiles.get(i);
                              AnalyzerItem ai = new AnalyzerItem();
                              ai.title = (i + 1) + ". " + f.getName();
                              ai.subtitle = f.getParent();
                              ai.file = f;
                              ai.size = f.length();
                              results.add(ai);
                          }
                      } else if (mode == 1) {
                          // Поиск дубликатов (сначала группируем по одинаковому размеру > 50 КБ, затем MD5)
                          Map<Long, List<File>> bySize = new HashMap<>();
                          for (File f : allFiles) {
                              long len = f.length();
                              if (len > 51200) {
                                  bySize.computeIfAbsent(len, k -> new ArrayList<>()).add(f);
                              }
                          }
                          for (Map.Entry<Long, List<File>> entry : bySize.entrySet()) {
                              if (entry.getValue().size() > 1) {
                                  Map<String, List<File>> byHash = new HashMap<>();
                                  for (File f : entry.getValue()) {
                                      String hash = fastFileHash(f);
                                      if (!hash.isEmpty()) {
                                          byHash.computeIfAbsent(hash, k -> new ArrayList<>()).add(f);
                                      }
                                  }
                                  for (List<File> dupGroup : byHash.values()) {
                                      if (dupGroup.size() > 1) {
                                          for (File f : dupGroup) {
                                              AnalyzerItem ai = new AnalyzerItem();
                                              ai.title = "[Дубликат] " + f.getName();
                                              ai.subtitle = f.getAbsolutePath();
                                              ai.file = f;
                                              ai.size = f.length();
                                              results.add(ai);
                                          }
                                      }
                                  }
                              }
                          }
                          Collections.sort(results, (a, b) -> Long.compare(b.size, a.size));
                      } else if (mode == 2) {
                          // Пустые папки и папки удаленных приложений в Android/media и Android/obb
                          File[] mediaDirs = new File(rootDir, "Android/media").listFiles();
                          if (mediaDirs != null) {
                              for (File d : mediaDirs) {
                                  if (d.isDirectory() && !installedPkgs.contains(d.getName())) {
                                      emptyOrCorpseDirs.add(0, d);
                                  }
                              }
                          }
                          File[] obbDirs = new File(rootDir, "Android/obb").listFiles();
                          if (obbDirs != null) {
                              for (File d : obbDirs) {
                                  if (d.isDirectory() && !installedPkgs.contains(d.getName())) {
                                      emptyOrCorpseDirs.add(0, d);
                                  }
                              }
                          }
                          for (File d : emptyOrCorpseDirs) {
                              AnalyzerItem ai = new AnalyzerItem();
                              boolean isCorpse = d.getAbsolutePath().contains("/Android/");
                              ai.title = (isCorpse ? "[Остаток удаленного прил.] " : "[Пустая папка] ") + d.getName();
                              ai.subtitle = d.getAbsolutePath();
                              ai.file = d;
                              ai.size = getFolderSize(d);
                              results.add(ai);
                          }
                      }

                      final String headerInfo = getPartitionsString() + "\n" +
                              "Видео: " + fmt(catSizes[0]) + " | Фото: " + fmt(catSizes[1]) + " | Аудио: " + fmt(catSizes[2]) + "\n" +
                              "Архивы: " + fmt(catSizes[3]) + " | APK: " + fmt(catSizes[4]) + " | Прочее: " + fmt(catSizes[5]);

                      runOnUiThread(() -> {
                          analyzerHeaderText.setText(headerInfo);
                          allAnalyzer.clear();
                          allAnalyzer.addAll(results);
                          applyFilterAndSort();
                      });
                  }).start();
              }

              private void collectFilesRecursive(File dir, List<File> allFiles, List<File> emptyDirs, long[] cats, Set<String> pkgs) {
                  if (dir == null || !dir.exists()) return;
                  File[] files = dir.listFiles();
                  if (files == null) return;
                  if (files.length == 0 && !dir.equals(Environment.getExternalStorageDirectory())) {
                      emptyDirs.add(dir);
                      return;
                  }
                  for (File f : files) {
                      if (f.isDirectory()) {
                          collectFilesRecursive(f, allFiles, emptyDirs, cats, pkgs);
                      } else {
                          allFiles.add(f);
                          long len = f.length();
                          String n = f.getName().toLowerCase(Locale.getDefault());
                          if (n.endsWith(".mp4") || n.endsWith(".mkv") || n.endsWith(".avi") || n.endsWith(".mov") || n.endsWith(".webm")) cats[0] += len;
                          else if (n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".png") || n.endsWith(".webp") || n.endsWith(".gif")) cats[1] += len;
                          else if (n.endsWith(".mp3") || n.endsWith(".flac") || n.endsWith(".wav") || n.endsWith(".ogg") || n.endsWith(".m4a")) cats[2] += len;
                          else if (n.endsWith(".zip") || n.endsWith(".rar") || n.endsWith(".7z") || n.endsWith(".tar") || n.endsWith(".gz")) cats[3] += len;
                          else if (n.endsWith(".apk") || n.endsWith(".apks") || n.endsWith(".xapk")) cats[4] += len;
                          else cats[5] += len;
                      }
                  }
              }

              // Быстрый MD5 по первым и последним 16 КБ файла для мгновенного поиска дубликатов
              private String fastFileHash(File f) {
                  try (FileInputStream fis = new FileInputStream(f)) {
                      MessageDigest md = MessageDigest.getInstance("MD5");
                      byte[] buf = new byte[16384];
                      int r = fis.read(buf);
                      if (r > 0) md.update(buf, 0, r);
                      if (f.length() > 32768) {
                          fis.skip(f.length() - 32768);
                          r = fis.read(buf);
                          if (r > 0) md.update(buf, 0, r);
                      }
                      byte[] digest = md.digest();
                      StringBuilder sb = new StringBuilder();
                      for (byte b : digest) sb.append(String.format("%02x", b));
                      return sb.toString();
                  } catch (Exception e) {
                      return "";
                  }
              }

              private void updatePartitionsHeader() {
                  analyzerHeaderText.setText(getPartitionsString() + "\nВыберите режим сканирования кнопками ниже:");
              }

              private String getPartitionsString() {
                  return "Разделы -> /data: " + getStatFsInfo(Environment.getDataDirectory()) +
                          " | /system: " + getStatFsInfo(Environment.getRootDirectory());
              }

              private String getStatFsInfo(File path) {
                  try {
                      StatFs stat = new StatFs(path.getAbsolutePath());
                      long total = stat.getTotalBytes();
                      long used = total - stat.getAvailableBytes();
                      return fmt(used) + "/" + fmt(total);
                  } catch (Exception e) {
                      return "Н/Д";
                  }
              }

              private void updateStatusBanner() {
                  File ext = Environment.getExternalStorageDirectory();
                  long totalSpace = ext.getTotalSpace();
                  long usedSpace = totalSpace - ext.getFreeSpace();
                  statusText.setText("Прил: " + displayApps.size() + "/" + allApps.size() +
                          " | Папок: " + displayFolders.size() +
                          " | Занято: " + fmt(usedSpace) + " из " + fmt(totalSpace));
              }

              private void applyFilterAndSort() {
                  // 1. Фильтрация приложений
                  displayApps.clear();
                  for (AppItem a : allApps) {
                      if (appFilterMode == 1 && a.isSystem) continue;
                      if (appFilterMode == 2 && !a.isSystem) continue;
                      if (!searchQuery.isEmpty()) {
                          if (!a.name.toLowerCase(Locale.getDefault()).contains(searchQuery) &&
                              !a.pkg.toLowerCase(Locale.getDefault()).contains(searchQuery)) {
                              continue;
                          }
                      }
                      displayApps.add(a);
                  }

                  Collections.sort(displayApps, (a, b) -> {
                      switch (sortMode) {
                          case 1: return Long.compare(a.totalAppSize, b.totalAppSize);
                          case 2: return a.name.compareToIgnoreCase(b.name);
                          case 3: return b.name.compareToIgnoreCase(a.name);
                          case 4: return Long.compare(b.cacheSize, a.cacheSize);
                          case 5: return Long.compare(b.installTime, a.installTime);
                          default: return Long.compare(b.totalAppSize, a.totalAppSize);
                      }
                  });

                  // 2. Фильтрация папок
                  displayFolders.clear();
                  for (FolderItem f : allFolders) {
                      if (!searchQuery.isEmpty() && !f.name.toLowerCase(Locale.getDefault()).contains(searchQuery)) {
                          continue;
                      }
                      displayFolders.add(f);
                  }

                  Collections.sort(displayFolders, (a, b) -> {
                      switch (sortMode) {
                          case 1: return Long.compare(a.size, b.size);
                          case 2: return a.name.compareToIgnoreCase(b.name);
                          case 3: return b.name.compareToIgnoreCase(a.name);
                          default: return Long.compare(b.size, a.size);
                      }
                  });

                  // 3. Фильтрация анализатора
                  displayAnalyzer.clear();
                  for (AnalyzerItem ai : allAnalyzer) {
                      if (!searchQuery.isEmpty() &&
                          !ai.title.toLowerCase(Locale.getDefault()).contains(searchQuery) &&
                          !ai.subtitle.toLowerCase(Locale.getDefault()).contains(searchQuery)) {
                          continue;
                      }
                      displayAnalyzer.add(ai);
                  }

                  // 4. Фильтрация процессов
                  displayProcs.clear();
                  for (ProcItem p : allProcs) {
                      if (appFilterMode == 1 && p.isSystem) continue;
                      if (appFilterMode == 2 && !p.isSystem) continue;
                      if (!searchQuery.isEmpty() &&
                          !p.name.toLowerCase(Locale.getDefault()).contains(searchQuery) &&
                          !p.pkg.toLowerCase(Locale.getDefault()).contains(searchQuery)) {
                          continue;
                      }
                      displayProcs.add(p);
                  }

                  if (adapterApps != null) adapterApps.notifyDataSetChanged();
                  if (adapterFolders != null) adapterFolders.notifyDataSetChanged();
                  if (adapterPkgs != null) adapterPkgs.notifyDataSetChanged();
                  if (adapterAnalyzer != null) adapterAnalyzer.notifyDataSetChanged();
                  if (adapterProcs != null) adapterProcs.notifyDataSetChanged();
                  updateStatusBanner();
              }

              private long getFolderSize(File dir) {
                  if (dir == null || !dir.exists()) return 0;
                  long size = 0;
                  File[] files = dir.listFiles();
                  if (files != null) {
                      for (File f : files) {
                          size += f.isDirectory() ? getFolderSize(f) : f.length();
                      }
                  }
                  return size;
              }

              private boolean deleteRecursive(File f) {
                  if (f.isDirectory()) {
                      File[] files = f.listFiles();
                      if (files != null) {
                          for (File child : files) {
                              deleteRecursive(child);
                          }
                      }
                  }
                  return f.delete();
              }

